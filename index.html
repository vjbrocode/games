<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<meta name="description" content="A collection of browser games. No install, no plugins — they run in the tab.">
<style>
  :root{
    --bg:#080b0a; --panel:#0f1614; --line:#1e2b26;
    --ink:#cfe0d8; --dim:#7e938a; --accent:#7dd39b; --warn:#ffb03a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:56px 20px 80px;}

  header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:36px;}
  h1{margin:0 0 10px;font-size:clamp(28px,6vw,44px);letter-spacing:4px;color:#fff;}
  .tagline{margin:0;color:var(--dim);font-size:15px;letter-spacing:1px;}

  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}

  .card{
    display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);
    padding:22px;text-decoration:none;color:inherit;
    transition:border-color .18s, transform .18s;
  }
  .card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none;}

  .card h2{margin:0 0 4px;font-size:19px;letter-spacing:2px;color:#fff;}
  .card .sub{margin:0 0 14px;font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
  .card p{margin:0 0 18px;font-size:14px;color:var(--dim);flex:1;}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .tag{font-size:11px;letter-spacing:1px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;}
  .tag.desktop{color:var(--warn);border-color:#4a3a1a;}

  .play{font-size:13px;letter-spacing:3px;color:var(--accent);}
  .card:hover .play{color:#fff;}

  footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);
    color:var(--dim);font-size:13px;}
  footer a{color:var(--accent);}

  @media (prefers-reduced-motion:reduce){.card{transition:none;} .card:hover{transform:none;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>GAMES</h1>
    <p class="tagline">Browser games. No install, no plugins — they run in the tab.</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    Source on <a href="https://github.com/vjbrocode/games">GitHub</a>.
  </footer>

</div>

<script>
/* ------------------------------------------------------------------
   To add a game: drop its folder in the repo root with an index.html
   inside, then add one entry here. Nothing else to wire up.
------------------------------------------------------------------ */
const GAMES = [
  {
    path:  "night-infiltration/",
    title: "Operation Nightfall",
    sub:   "Stealth FPS",
    blurb: "Infiltrate Forward Operating Base Ravenscar at night. Blind six cameras " +
           "before the garrison calls the valley, hack the signals mainframe, then get out. " +
           "Ridges, treelines, a tank and a gunship are all yours to use.",
    tags:  ["3D", "three.js", "Keyboard + mouse"]
  }
];

document.getElementById("grid").innerHTML = GAMES.map(g => `
  <a class="card" href="${g.path}">
    <h2>${g.title}</h2>
    <p class="sub">${g.sub}</p>
    <p>${g.blurb}</p>
    <div class="tags">${g.tags.map(t =>
      `<span class="tag${/keyboard|mouse|desktop/i.test(t) ? " desktop" : ""}">${t}</span>`
    ).join("")}</div>
    <span class="play">PLAY &rsaquo;</span>
  </a>
`).join("");
</script>
</body>
</html>
